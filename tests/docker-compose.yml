# Tests stack: a throwaway sibling of the real stack. Extends the Base
# compose with an isolated identity — its own project name, container name,
# project-scoped volume, and dummy env — so it runs beside the live project
# (rtx-workspace) without touching it.
name: rtx-workspace-tests

services:
  workspace:
    extends:
      file: ../src/docker-compose.yml
      service: workspace
    container_name: workspace-test
    # extends unions env_file sequences; !override replaces the Base's
    # ../.env.service so real secrets never reach test containers.
    # required: false keeps validation green on fresh clones.
    env_file: !override
      - path: .env.service.test
        required: false
    # The test suite's SSH harness: compose interpolates the public half of a
    # throwaway generated key from the invoking process's environment (it
    # wins over the dummy env_file), and the Bootstrap script's setup_ssh
    # wires it into authorized_keys on first boot.
    environment:
      SSH_AUTHORIZED_KEY: ${SSH_AUTHORIZED_KEY:-}
    # The matching throwaway SSH surface: random host port (resolved by the
    # suite through `docker compose port`), gone with the container when the
    # stack comes down. Every interface, not loopback-only: a runner inside
    # a workspace cannot reach the host's loopback, only the host's gateway
    # address (ADR 0005) — and a throwaway port and key bound the exposure.
    ports:
      - target: 22
        host_ip: 0.0.0.0
        protocol: tcp
    # Healthy only once sshd answers — which happens after the first-boot
    # bootstrap finishes, so `up --wait` gates on a fully-booted workspace.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
      interval: 10s
      timeout: 5s
      retries: 110
      start_period: 60s

  # Extending workspace carries its depends_on: nginx, but extends never
  # imports the sibling service — every consumer must materialize nginx
  # itself. This stack swaps the Base's bind mount for a built image: the
  # daemon resolves bind sources against the host filesystem, where the
  # repo does not exist when the suite runs from inside a workspace (the
  # repo lives in the /nix volume), so the mounted web root turned into an
  # empty auto-created directory and the healthcheck failed forever. The
  # build context travels client-side, so it works from anywhere (ADR 0004).
  # !override drops the inherited bind, and the dedicated tag keeps the
  # build from shadowing the official nginx:alpine the Base declares.
  nginx:
    extends:
      file: ../src/docker-compose.yml
      service: nginx
    image: rtx-workspace-tests-nginx:latest
    build:
      context: ..
      dockerfile: tests/Dockerfile.nginx
    volumes: !override []

volumes:
  nix:
