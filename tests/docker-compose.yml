# Tests stack: a standalone throwaway stack, isolated from any live one by
# identity — its own project name, container name, project-scoped volume,
# and dummy env — so it runs beside a real deployment without touching it.
# Nothing is inherited through extends: every service is declared here in
# full, and every relative path (env files, build contexts, the nginx
# Dockerfile) resolves against this file's directory, tests/. Both builds
# use context src, the tracked symlink tests/src -> ../src, so the uploaded
# tree is exactly what a plain build from src/ would send (ADR 0007).
name: rtx-workspace-tests

services:
  workspace:
    container_name: workspace-test
    hostname: rtx-workspace
    init: true
    ipc: host
    # Implicit Dockerfile: src/Dockerfile through the tests/src symlink.
    build:
      context: src
    image: rtx-workspace:latest
    # The dummy env file keeps real secrets out of test containers;
    # required: false keeps validation green on fresh clones.
    env_file:
      - path: .env.service.test
        required: false
    # The test suite's SSH harness: compose interpolates the public half of a
    # throwaway generated key from the invoking process's environment (it
    # wins over the dummy env_file), and the Bootstrap script's setup_ssh
    # wires it into authorized_keys on first boot. MIRROR_PROBE is the
    # Environment-mirror acceptance probe: the recreate test brings the stack
    # back up with it set, proving a container recreated with a new variable
    # projects it onto the SSH surfaces. SKIP_GIT_USER_SIGNING_KEY rides the
    # same interpolation so a local run with a scoped GH_TOKEN can exercise
    # the signing opt-out; with the stack's token-less env the Bootstrap's
    # signing setup never runs either way.
    environment:
      # The Tests stack pins the bootstrap fetch to its own nginx — the Web
      # root this tree built — instead of the image default (the repo's main
      # branch on GitHub), so the suite provisions from and proves the
      # working tree's script, never the last merge.
      USER_INSTALL_URL: http://nginx/user-install.sh
      SSH_AUTHORIZED_KEY: ${SSH_AUTHORIZED_KEY:-}
      MIRROR_PROBE: ${MIRROR_PROBE:-}
      SKIP_GIT_USER_SIGNING_KEY: ${SKIP_GIT_USER_SIGNING_KEY:-}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: volume
        source: nix
        target: /nix
    group_add:
      - ${DOCKER_GID:-990}
    working_dir: /nix/ubuntu
    # The matching throwaway SSH surface: random host port (resolved by the
    # suite through `docker compose port`), gone with the container when the
    # stack comes down. Every interface, not loopback-only: a runner inside
    # a workspace cannot reach the host's loopback, only the host's gateway
    # address (ADR 0005) — and a throwaway port and key bound the exposure.
    ports:
      - target: 22
        host_ip: 0.0.0.0
        protocol: tcp
    # Healthy only once sshd answers — which happens after the first-boot
    # bootstrap finishes, so `up --wait` gates on a fully-booted workspace.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
      interval: 10s
      timeout: 5s
      retries: 110
      start_period: 60s
    depends_on:
      nginx:
        condition: service_healthy

  # The workspace waits on nginx before its first boot. This stack bakes the
  # Bootstrap script into a built image instead of bind-mounting it: the
  # daemon resolves bind sources against the host filesystem, where the repo
  # does not exist when the suite runs from inside a workspace (the repo
  # lives in the /nix volume), so the mounted web root turned into an empty
  # auto-created directory and the healthcheck failed forever. A build
  # context, unlike a bind, always travels client-side, so it works from
  # anywhere (ADR 0004). The context is the same tests/src symlink the
  # workspace builds from, while the Dockerfile stays in tests/, outside the
  # context, and reaches the builder through its own transfer (ADR 0007).
  # The dedicated tag keeps the build from shadowing the official
  # nginx:alpine.
  nginx:
    image: rtx-workspace-tests-nginx:latest
    build:
      context: src
      dockerfile: ../Dockerfile.nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/user-install.sh"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 5s

volumes:
  nix:
