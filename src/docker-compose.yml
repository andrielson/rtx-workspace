# Base compose: the source of truth for the workspace service (everything
# except GPU reservation), its /nix volume (the Nix store plus the ubuntu home
# under it), and the nginx service every stack needs at first boot (the
# entrypoint curls http://nginx/user-install.sh until the volume has been
# bootstrapped). Consumers — the root Prod overlay and tests/docker-compose.yml
# — extend these services. This file declares no networks on purpose: each
# consumer shapes its own default network, and relative paths here
# (../.env.service, ./user-install.sh, build context) always resolve against
# this file's directory.
services:
  workspace:
    hostname: rtx-workspace
    init: true
    ipc: host
    build: .
    image: rtx-workspace:latest
    # Optional so validation and start-up work on fresh clones without
    # secrets; the bootstrap script guards every variable it reads.
    env_file:
      - path: ../.env.service
        required: false
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: volume
        source: nix
        target: /nix
    group_add:
      - ${DOCKER_GID:-990}
    working_dir: /nix/ubuntu
    depends_on:
      nginx:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/user-install.sh"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 5s
    volumes:
      - type: bind
        source: ./user-install.sh
        target: /usr/share/nginx/html/user-install.sh
        read_only: true

volumes:
  nix:
