name: CI

# No workflow-level `paths` filter: the `main` ruleset requires the Hygiene
# and Test suite checks on every pull request, and a workflow skipped by path
# filtering never reports them, leaving the PR unmergeable. Jobs skip through
# `if:` conditions instead — a skipped job reports success.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

# Fork pull requests run with a read-only token and no secrets; the publish
# path is push-to-main only, which a fork can never produce. This workflow
# must never use pull_request_target (base-repo permissions over fork code).
# Third-party actions are pinned by commit SHA, never by a moving tag.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # hygiene and test-suite gate on the same path set — one output for both
      hygiene: ${{ steps.filter.outputs.hygiene }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - name: Check out the repository (full history, for the range diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # workflow_dispatch runs everything (the manual self-heal path); a pull
      # request diffs its own range; a push to main is a squash merge (direct
      # pushes are blocked by the ruleset), so HEAD~1...HEAD is exactly the
      # merged pull request's diff.
      - name: Decide which jobs the changed paths concern
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            echo 'hygiene=true' >> "${GITHUB_OUTPUT}"
            echo 'release=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          else
            range='HEAD~1...HEAD'
          fi
          hygiene_paths=$(git diff --name-only "${range}" -- src tests .github/workflows/ci.yml package.json bun.lock)
          if [[ -n "${hygiene_paths}" ]]; then
            echo 'hygiene=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'hygiene=false' >> "${GITHUB_OUTPUT}"
          fi
          release_paths=$(git diff --name-only "${range}" -- src .github/workflows/ci.yml package.json)
          if [[ -n "${release_paths}" ]]; then
            echo 'release=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'release=false' >> "${GITHUB_OUTPUT}"
          fi

  hygiene:
    name: Hygiene
    needs: changes
    # Skipped — which reports success, so the ruleset's required check still
    # passes — when the diff touches none of the gate paths above:
    # documentation-only and repository-machinery changes validate locally
    # through pre-commit.
    if: needs.changes.outputs.hygiene == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun (reads the version from packageManager)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # apt ships an older minor than the 0.10+ the README requires
      - name: Install ShellCheck
        run: |
          shellcheck_version='v0.10.0'
          curl --fail --silent --show-error --location \
            --output "/tmp/shellcheck-${shellcheck_version}.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${shellcheck_version}/shellcheck-${shellcheck_version}.linux.x86_64.tar.xz"
          tar --extract --xz --file "/tmp/shellcheck-${shellcheck_version}.tar.xz" --directory /tmp
          install --directory "$HOME/.local/bin"
          install --mode=0755 "/tmp/shellcheck-${shellcheck_version}/shellcheck" "$HOME/.local/bin/shellcheck"
      - name: Biome
        run: bun run lint
      - name: Prettier
        run: bun run format:check
      - name: Type check
        run: bun run typecheck
      - name: ShellCheck
        run: bun run lint:sh
      - name: Compose schema
        run: bun run lint:compose

  test-suite:
    name: Test suite
    needs: [changes, hygiene]
    # Draft PRs run hygiene only; the suite joins when the PR is ready for
    # review (ready_for_review re-triggers this workflow). Skipped together
    # with hygiene when the diff matches no gate path.
    if: needs.changes.outputs.hygiene == 'true' && ((github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun (reads the version from packageManager)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Missing before the first Release exists (cold bootstrap) and while
      # the package is still private — both fall through to a cold build.
      - name: Pull the latest release (cache source)
        id: pull-latest
        continue-on-error: true
        run: docker pull ghcr.io/andrielson/rtx-workspace:latest
      # Warms the daemon-side BuildKit cache so the suite's compose build
      # resolves as cache hits; the release image carries inline cache
      # metadata precisely for this docker-build cache-from path.
      - name: Warm the daemon build cache from the release image
        if: steps.pull-latest.outcome == 'success'
        run: docker build --cache-from ghcr.io/andrielson/rtx-workspace:latest --tag rtx-workspace:latest src
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the suite
        id: suite
        continue-on-error: true
        timeout-minutes: 75
        run: bun test
      # One full-suite retry: a vendor-endpoint hiccup gets a second chance
      # (the same flakiness the pre-push hook sidesteps), while a real
      # regression fails deterministically twice.
      - name: Retry the suite once
        if: steps.suite.outcome == 'failure'
        timeout-minutes: 75
        run: bun test

  release:
    name: Release
    needs: [changes, hygiene]
    # Push to main is the merge; workflow_dispatch on main is the manual
    # self-heal path. The repository guard keeps forks from ever publishing.
    # The release gate paths are a subset of hygiene's, so a skipped hygiene
    # already implies this gate is false.
    if: github.repository == 'andrielson/rtx-workspace' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the repository (full history with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # The default docker driver cannot export registry cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the version and decide whether to publish
        id: version
        run: |
          version=$(jq --raw-output '.version' package.json)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version '${version}' is not X.Y.Z semver" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # The git tag is the publication record: present means already
          # released, absent means publish (a failed publish self-heals on
          # the next run, because the tag never landed).
          if git rev-parse --verify --quiet "refs/tags/v${version}" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push the image
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          pull: true
          push: true
          tags: |
            ghcr.io/andrielson/rtx-workspace:v${{ steps.version.outputs.version }}
            ghcr.io/andrielson/rtx-workspace:latest
          labels: |
            org.opencontainers.image.title=rtx-workspace
            org.opencontainers.image.description=A GPU-capable remote development workspace delivered as a Docker image
            org.opencontainers.image.version=v${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=ghcr.io/andrielson/rtx-workspace:buildcache
          cache-to: |
            type=registry,ref=ghcr.io/andrielson/rtx-workspace:buildcache,mode=max
            type=inline
      - name: Create the git tag and the GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="v${{ steps.version.outputs.version }}"
          gh release create "${release}" --title "${release}" --generate-notes --target "${{ github.sha }}"
