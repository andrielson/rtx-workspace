# Prod overlay: the real, long-running stack. Extends the Base compose
# (src/docker-compose.yml) with what only production wants — the GPU
# reservation, the external gateway network, the stable container name, and
# the SSH port.
services:
  workspace:
    extends:
      file: src/docker-compose.yml
      service: workspace
    container_name: workspace
    ports:
      - target: 22
        published: 2222
        protocol: tcp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nginx:
    extends:
      file: src/docker-compose.yml
      service: nginx

volumes:
  nix:

networks:
  default:
    external: true
    name: gateway
